name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag (leer lassen für auto-increment)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.bump_version.outputs.version }}

    strategy:
      matrix:
        include:
          - dockerfile: ./Dockerfile
            suffix: ""
          - dockerfile: ./Dockerfile.alpine
            suffix: "-alpine"

    steps:
      - name: Datum ermitteln
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version berechnen (Auto-Increment Patch)
        id: bump_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Letzter bekannter Tag: $LATEST_TAG"

          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TARGET_VERSION="${{ inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            PATCH=$(echo "$PATCH" | grep -o '^[0-9]*')
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Bauen mit Ziel-Version: $TARGET_VERSION"
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT

      - name: Log in zur GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten extrahieren
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.bump_version.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag-Namen definieren
        id: vars
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.bump_version.outputs.version }}${{ matrix.suffix }}" >> $GITHUB_ENV
          echo "LATEST_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.suffix }}" >> $GITHUB_ENV

      - name: Build und Push Docker Image (Multi-Arch)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.IMAGE_TAG }},${{ env.LATEST_TAG }}
          provenance: false
          build-args: |
            VERSION=${{ steps.bump_version.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release & Git-Tag erstellen
        if: matrix.suffix == '' # Verhindert, dass das Release doppelt erstellt wird
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          name: Release ${{ steps.bump_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: fpm installieren
        run: sudo gem install --no-document fpm

      - name: Package per pip in ein Zielverzeichnis installieren
        run: python3 -m pip install --no-deps --no-cache-dir --target=install .

      - name: .deb-Verzeichnisstruktur aufbauen
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          echo "DEB_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

          # Shebang auf den System-Python fixen - pip schreibt sonst den
          # Interpreter-Pfad DIESES Runners rein, der auf einer echten
          # Debian/Ubuntu-Installation nicht existiert.
          sed -i '1s|.*|#!/usr/bin/python3|' install/bin/yt-upload install/bin/get-token
          rm -rf install/yt_upload/__pycache__ install/get_token/__pycache__

          # /usr/lib/python3/dist-packages statt eines eigenen PYTHONPATH-
          # Verzeichnisses (wie im Dockerfile) - das ist bei einem .deb der
          # Standard-Suchpfad von Debians System-Python, beide Packages sind
          # damit ohne zusätzliche Umgebungsvariablen importierbar. get_token
          # läuft hier (anders als im Dockerfile) als regulärer, per pip
          # installierter Entry-Point statt als bare-copy-Skript - für ein
          # .deb, das ohnehin das ganze Package installiert, unnötig, das
          # nachzubilden.
          mkdir -p pkgroot/usr/bin pkgroot/usr/lib/python3/dist-packages pkgroot/etc/yt-upload/conf.d
          cp install/bin/yt-upload install/bin/get-token pkgroot/usr/bin/
          chmod 755 pkgroot/usr/bin/yt-upload pkgroot/usr/bin/get-token
          cp -r install/yt_upload pkgroot/usr/lib/python3/dist-packages/yt_upload
          cp -r install/get_token pkgroot/usr/lib/python3/dist-packages/get_token
          cp -r install/yt_upload-*.dist-info pkgroot/usr/lib/python3/dist-packages/
          cp upload.conf.example pkgroot/etc/yt-upload/upload.conf

      - name: .deb bauen
        run: |
          fpm -s dir -t deb -f \
            -n yt-upload \
            -v "$DEB_VERSION" \
            -a all \
            --license GPL-3.0 \
            --maintainer "chaos7x" \
            --description "Automatisierter YouTube Upload Workflow" \
            --url "https://github.com/${{ github.repository }}" \
            --depends python3 \
            --depends python3-requests \
            --depends ffmpeg \
            --deb-recommends python3-inotify \
            --config-files /etc/yt-upload/upload.conf \
            -C pkgroot \
            usr etc

      - name: .deb als Release-Asset hochladen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push.outputs.version }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

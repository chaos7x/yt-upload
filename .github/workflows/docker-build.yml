name: Docker Build

# Baut alle Dockerfile-Varianten auf jedem PR und Push nach main, OHNE zu
# pushen - reine Build-Validierung. docker-release.yml baut (und pusht nach
# GHCR) nur bei Tag-Pushes bzw. manuell und deckt Dockerfile.pyimg gar nicht
# ab - ohne diesen Workflow würde ein kaputtes Dockerfile erst beim nächsten
# tatsächlichen Release auffallen, nicht schon im PR.
#
# pull: true + wöchentlicher schedule-Trigger: Dockerfile.pyimg baut auf
# python:3-slim (unversionierter, floatender Tag) - ohne erzwungenen Pull
# und ohne regelmäßigen Lauf unabhängig von Code-Änderungen würde eine neue
# Python-Version, die die Scripte bricht, erst beim nächsten zufälligen PR
# auffallen statt zeitnah. Debian/Alpine floaten ebenfalls innerhalb ihrer
# Major-Version, profitieren also vom selben Mechanismus.
#
# Trivy-Scan (nicht blockierend, exit-code 0): apt-get upgrade/apk upgrade
# patchen nur, was der jeweilige Paketmanager kennt. Unter Debian kommen
# requests über das apt-Paket python3-requests
# (siehe Dockerfile) und sind damit bereits durch apt-get upgrade + Trivys
# Debian-Scan abgedeckt - kein pip-Fall. Unter Alpine/pyimg dagegen laufen
# sie bewusst per pip, teils ohne Versionspin direkt im
# Dockerfile - dafür gibt es keine von Dependabot lesbare Manifestdatei
# (weder pip- noch irgendein anderes Ecosystem sieht eine nackte
# `RUN pip install`-Zeile), es wird bei jedem Build einfach die aktuell
# neueste Version gezogen. Trivy ist hier die einzige Stelle, die zeigt,
# welche Version das tatsächlich war und ob sie bekannte (auch noch
# ungefixte) CVEs hat.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'  # Jeden Montag 06:00 UTC

# Least Privilege: dieser Workflow liest nur das Repo (Checkout) und pusht
# nichts - der GITHUB_TOKEN bekommt deshalb ausdruecklich nur Leserechte statt
# der Repo-/Org-Standardrechte.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - dockerfile: ./Dockerfile
            name: debian
          - dockerfile: ./Dockerfile.alpine
            name: alpine
          - dockerfile: ./Dockerfile.pyimg
            name: pyimg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Datum ermitteln
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker Image bauen (${{ matrix.variant.name }}, kein Push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ci-scan:${{ matrix.variant.name }}
          pull: true
          build-args: |
            VERSION=ci-${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}

      - name: Trivy-Scan (${{ matrix.variant.name }}, nicht blockierend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-scan:${{ matrix.variant.name }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

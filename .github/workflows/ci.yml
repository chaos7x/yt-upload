name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test- und Lint-Abhängigkeiten installieren
        run: pip install -r requirements-test.txt

      # Für tests/test_media_containers.py (echte mkv/mp4/m4v/mov/webm-Dateien,
      # zur Laufzeit per ffmpeg erzeugt) - ohne ffmpeg würden sie übersprungen.
      - name: ffmpeg installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests ausführen
        run: pytest -v

      - name: Linting ausführen
        run: ruff check src/yt_upload/ src/get_token/

[project]
name = "yt-upload"
version = "1.9.4"
description = "Automatisierter YouTube Upload Workflow"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "chaos7x"},
]
keywords = ["youtube", "upload", "video", "resumable-upload", "ffmpeg", "automation", "daemon", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/chaos7x/yt-upload"
Repository = "https://github.com/chaos7x/yt-upload"
Issues = "https://github.com/chaos7x/yt-upload/issues"

[project.optional-dependencies]
# inotify ist bewusst optional: der Dämon-Modus hat einen try/except-Fallback
# auf Polling, falls das Modul fehlt (siehe yt_upload/daemon.py, HAS_INOTIFY).
daemon = ["inotify"]

[project.scripts]
yt-upload = "yt_upload.main:main"
get-token = "get_token.get_token:main"

# Wird sowohl für die Bare-Metal-Installation als auch im Docker-Build genutzt:
# `pip install --break-system-packages --no-deps .` Die oben deklarierten
# Dependencies dienen primär der Dokumentation/Metadaten (pip show yt-upload).
# Tatsächlich installiert wird requests je nach Umgebung über apt/apk
# (python3-requests/py3-requests) oder direkt per pip (Dockerfile.pyimg);
# inotify kommt unter Debian/Alpine ebenfalls über pip (siehe Dockerfile bzw.
# Dockerfile.alpine), da das apk-Paket py3-inotify ein anderes, unpassendes
# Projekt packt. --no-deps stellt in den apt/apk-basierten Installationsarten
# sicher, dass pip nur das eigene Package installiert und requests nicht
# zusätzlich von PyPI nachlädt.
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "LOG", "BLE", "PLW1510", "DTZ", "SIM", "PIE", "C4", "EXE", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
